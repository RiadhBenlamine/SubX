[project]
name = "subx-recon"
version = "2.0.12"
description = "SUBX — Subdomain Reconnaissance & Asset Management Framework"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "rbn0x00" }
]
requires-python = ">=3.10"
keywords = [
    "subdomain",
    "recon",
    "bug-bounty",
    "osint",
    "security",
    "httpx",
    "postgresql",
    "subdomain-enumeration",
    "reconnaissance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.11.0",
    "python-dotenv>=1.2.2",
    "shodan>=1.31.0",
    "censys-platform>=0.14.0",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "sqlmodel>=0.0.38",
    "sqlalchemy>=2.0.50",
    "typer>=0.26.7",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "ruff>=0.9.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/RiadhBenlamine/SubX"
Repository = "https://github.com/RiadhBenlamine/SubX"
Documentation = "https://github.com/RiadhBenlamine/SubX#readme"
"Bug Tracker" = "https://github.com/RiadhBenlamine/SubX/issues"

[project.scripts]
subx = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "main.py",
    "core/**/*.py",
    "plugins/**/*.py",
    "tools/**/*.py",
    "config_samples/*",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "core/**/*.py",
    "plugins/**/*.py",
    "tools/**/*.py",
    "config_samples/*",
]
