[project]
name = "subx"
version = "2.0.0"
description = "SUBX — Subdomain Recon Framework"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.11.0",
    "python-dotenv>=1.2.2",
    "shodan>=1.31.0",
    "censys-platform>=0.14.0",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "sqlmodel>=0.0.38",
    "sqlalchemy>=2.0.50",
    "typer>=0.26.7",
    "rich>=15.0.0",
]

[project.scripts]
subx = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "**/*.py"]
